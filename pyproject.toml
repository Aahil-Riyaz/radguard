[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "radguard"
version = "0.1.0.dev0"
description = "Integrity and safety scanner for medical imaging (DICOM): hidden malware, patient-data leaks, and tampered scans."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dicom", "medical-imaging", "security", "polyglot", "phi", "forensics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # 6.156+ ships an unsigned native extension that Windows Smart App Control /
    # WDAC policies block; the pure-Python releases run everywhere.
    "hypothesis>=6.100,<6.156; sys_platform == 'win32'",
    "hypothesis>=6.100; sys_platform != 'win32'",
    # Reference implementation for differential tests (what real software sees)
    "pydicom>=3.0",
    "numpy>=1.26",
    "coverage>=7.4",
]

[project.scripts]
radguard = "radguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["radguard"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

# Strict typing for the package. On Windows machines whose application-control
# policy blocks mypy's compiled build: pip install --no-binary mypy mypy
[tool.mypy]
files = ["src/radguard"]
python_version = "3.10"
strict = true
